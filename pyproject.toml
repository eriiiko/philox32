[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "philox32"
version = "0.1.0"
description = "Philox-4x32-10 counter-based RNG: bit-identical on CPU, CUDA device and Python, integer-only."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Erik Steen" }]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
test = ["pytest", "numpy"]

[tool.setuptools]
py-modules = ["philox32"]

[tool.pytest.ini_options]
testpaths = ["tests"]
